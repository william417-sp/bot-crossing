<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot Crossing — Agency HQ</title>
    <meta name="theme-color" content="#0a0c12" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230a0c12' width='32' height='32' rx='4'/><circle cx='16' cy='16' r='8' fill='none' stroke='%2360a5fa' stroke-width='1.5'/><circle cx='16' cy='16' r='3' fill='%2360a5fa'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">⬡</span>
          <h1>Bot Crossing</h1>
          <span class="tag">Grok Bot HQ</span>
        </div>
        <div class="mode-toggle" role="group" aria-label="Mode">
          <button type="button" id="btn-demo" class="mode-btn" data-mode="demo">Demo</button>
          <button type="button" id="btn-live" class="mode-btn" data-mode="live">Live</button>
          <button type="button" id="btn-team" class="mode-btn active" data-mode="team">Team</button>
        </div>
        <div id="status-pill" class="pill">team · initializing</div>
      </header>
      <main id="stage">
        <canvas id="world" aria-label="Garage HQ canvas"></canvas>
        <aside id="agent-panel" class="panel hidden" aria-live="polite">
          <button type="button" id="panel-close" class="close-btn" aria-label="Close">×</button>
          <h2 id="panel-title">Bot</h2>
          <div id="panel-meta"></div>
          <h3>Recent activity</h3>
          <ul id="panel-logs"></ul>
        </aside>
      </main>
      <aside id="log-panel" class="panel">
        <div class="log-header">
          <h2>Workflow</h2>
          <span id="log-mode-label">Team activity</span>
        </div>
        <div id="log-stream"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
